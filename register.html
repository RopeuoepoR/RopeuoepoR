<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 响应式核心标签：适配手机端 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册账号</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 导航栏样式：与登录页、主页保持一致 */
        nav {
            background-color: #2c3e50;
            padding: 1rem 5%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* 注册主体区域：垂直水平居中 */
        .section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 5%;
        }

        /* 注册卡片：视觉分层 */
        .auth-box {
            background-color: #fff;
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .auth-box h2 {
            color: #2c3e50;
            margin-bottom: 2rem;
            font-size: 1.8rem;
            font-weight: 600;
        }

        /* 输入框样式：带聚焦反馈 */
        .auth-box input {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1.2rem;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .auth-box input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        /* 注册按钮：hover动效 */
        .auth-box button {
            width: 100%;
            padding: 1rem;
            background-color: #3498db;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1.5rem;
        }

        .auth-box button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.2);
        }

        .auth-box button:active {
            transform: translateY(0);
        }

        /* 登录链接样式 */
        .auth-box p {
            color: #666;
            font-size: 0.95rem;
        }

        .auth-box a {
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }

        .auth-box a:hover {
            text-decoration: underline;
        }

        /* 返回按钮样式：与登录页一致 */
        .back-btn {
            display: block;
            width: fit-content;
            margin: 0 auto 2rem;
            padding: 0.8rem 1.5rem;
            background-color: #e74c3c;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background-color: #c0392b;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.2);
        }

        /* 页脚样式：固定底部 */
        footer {
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            padding: 1.5rem 0;
            margin-top: auto;
        }

        /* 手机端适配：缩小间距和字号 */
        @media (max-width: 480px) {
            .auth-box {
                padding: 2rem 1.5rem;
            }

            .auth-box h2 {
                font-size: 1.5rem;
            }

            .back-btn {
                padding: 0.7rem 1.2rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <nav>...同上导航...</nav>
    <main class="section">
        <div class="auth-box">
            <h2>注册账号</h2>
            <input type="text" id="regUser" placeholder="用户名">
            <input type="password" id="regPass" placeholder="密码">
            <input type="password" id="regPass2" placeholder="确认密码">
            <button onclick="register()">立即注册</button>
            <p>已有账号？<a href="login.html">去登录</a></p>
        </div>
    </main>
    <a class="back-btn" href="index.html">返回</a>
    <footer>
        <p>所有版权都归Rope所有</p>
    </footer>
    <script src="assets/js/auth.js"></script>
</body>
</html>
