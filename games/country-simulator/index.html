<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国家领土模拟器 - Rope的小游戏</title>
    <style>
        /* 全局重置与变量 */
        :root {
            --main-gold: #ffd700;
            --bg-dark: #1a1a2e;
            --bg-darker: #16213e;
            --bg-deep: #0f3460;
            --panel-bg: rgba(0, 0, 0, 0.4);
            --border-gold: 1px solid var(--main-gold);
            --radius: 12px;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            --hover-up: translateY(-3px);
            --transition: all 0.3s ease;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 50%, var(--bg-deep) 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            padding-top: 70px; /* 给导航栏留空间 */
        }

        /* 导航栏（与全站统一，关联二级子页面） */
        .game-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #2c3e50;
            padding: 0.8rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            z-index: 999;
        }
        .game-nav .logo {
            color: var(--main-gold);
            font-size: 1.2rem;
            font-weight: bold;
        }
        .game-nav .back-btn {
            color: #fff;
            background: #e74c3c;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            text-decoration: none;
            transition: var(--transition);
        }
        .game-nav .back-btn:hover {
            background: #c0392b;
            transform: var(--hover-up);
        }

        /* 游戏头部 */
        .game-header {
            text-align: center;
            padding: 1.2rem;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 2px solid var(--main-gold);
        }
        .game-header h1 {
            font-size: 1.8rem;
            color: var(--main-gold);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* 游戏容器（响应式适配） */
        .game-container {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            padding: 1.2rem;
            min-height: calc(100vh - 150px);
        }
        @media (min-width: 768px) {
            .game-container {
                flex-direction: row;
                gap: 1.5rem;
            }
        }

        /* 左侧面板 */
        .left-panel {
            width: 100%;
            max-width: 260px;
            background: var(--panel-bg);
            border-radius: var(--radius);
            padding: 1.2rem;
            border: var(--border-gold);
            margin: 0 auto;
        }
        @media (min-width: 768px) {
            .left-panel {
                margin: 0;
            }
        }
        .control-btn {
            width: 100%;
            padding: 1rem;
            margin: 0.8rem 0;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .control-btn:hover {
            transform: var(--hover-up);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
        .diplomacy-panel {
            display: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 1rem;
            border-radius: var(--radius);
            margin-top: 1rem;
            border: var(--border-gold);
        }
        .diplomacy-panel h3 {
            color: var(--main-gold);
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
        }
        .country-relation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem;
            margin: 0.4rem 0;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 6px;
        }
        .relation-status {
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.85rem;
        }
        .relation-friendly { background: #27ae60; }
        .relation-neutral { background: #f39c12; }
        .relation-hostile { background: #e74c3c; }

        /* 主游戏区 */
        .main-game {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius);
            position: relative;
            border: 2px solid var(--main-gold);
            padding: 1rem;
            min-height: 400px;
        }
        .resources-bar {
            position: absolute;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            border: var(--border-gold);
            z-index: 10;
        }
        .resource-item {
            text-align: center;
            min-width: 70px;
        }
        .resource-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--main-gold);
        }

        /* 游戏地图与国家展示 */
        .game-map {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255, 215, 0, 0.1) 0%, transparent 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding-top: 60px; /* 给资源栏留空间 */
        }
        .country-display {
            text-align: center;
            padding: 2rem;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            border: 2px solid var(--main-gold);
            transition: var(--transition);
        }
        .country-display:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.2);
        }
        .country-display h2 {
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
        }
        .country-color {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #fff;
            margin: 0.8rem auto 0;
        }

        /* 事件日志 */
        .event-log {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            width: 280px;
            max-width: 90%;
            height: 180px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: var(--radius);
            padding: 1rem;
            border: var(--border-gold);
            overflow-y: auto;
        }
        .event-log::-webkit-scrollbar {
            width: 6px;
        }
        .event-log::-webkit-scrollbar-thumb {
            background: var(--main-gold);
            border-radius: 3px;
        }
        .event-log-title {
            color: var(--main-gold);
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .event-item {
            margin: 0.4rem 0;
            padding: 0.6rem;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 5px;
            font-size: 0.85rem;
            border-left: 3px solid var(--main-gold);
        }

        /* 破解菜单 */
        .hack-menu {
            position: absolute;
            top: 0.8rem;
            right: 0.8rem;
            background: rgba(255, 0, 0, 0.2);
            padding: 0.8rem;
            border-radius: 6px;
            border: 1px solid #ff0000;
            z-index: 20;
        }
        .hack-menu-title {
            color: #ff0000;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .hack-btn {
            background: #ff0000;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            margin: 0.2rem;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: var(--transition);
        }
        .hack-btn:hover {
            background: #cc0000;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #2c3e50, #34495e);
            padding: 1.5rem;
            border-radius: var(--radius);
            border: 2px solid var(--main-gold);
            width: 90%;
            max-width: 400px;
        }
        .modal h2 {
            color: var(--main-gold);
            margin-bottom: 1rem;
            text-align: center;
            font-size: 1.5rem;
        }
        .form-group {
            margin: 1rem 0;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--main-gold);
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: var(--border-gold);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
        }
        .form-group input:focus {
            outline: none;
            border-color: #ffec3d;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2);
        }
        .color-selector {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }
        .country-color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #fff;
            cursor: pointer;
            transition: var(--transition);
        }
        .country-color-option:hover,
        .country-color-option.active {
            border-width: 3px;
            transform: scale(1.1);
        }
        .modal-buttons {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin-top: 1.2rem;
        }
        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: var(--transition);
        }
        .btn-primary {
            background: var(--main-gold);
            color: #000;
            font-weight: bold;
        }
        .btn-primary:hover {
            background: #ffec3d;
        }

        /* 页脚 */
        footer {
            background: #2c3e50;
            color: #fff;
            text-align: center;
            padding: 1rem;
            font-size: 0.85rem;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <!-- 导航栏：关联小游戏二级子页面 -->
    <nav class="game-nav">
        <div class="logo">国家领土模拟器</div>
        <a href="../games.html" class="back-btn">返回小游戏合集</a>
    </nav>

    <!-- 游戏头部 -->
    <div class="game-header">
        <h1>国家领土模拟器 - 完整版</h1>
    </div>

    <!-- 游戏容器 -->
    <div class="game-container">
        <div class="left-panel">
            <button class="control-btn" onclick="buildCity()">建造城市</button>
            <button class="control-btn" onclick="recruitArmy()">招募军队</button>
            <button class="control-btn" onclick="openDiplomacy()">外交</button>
            <button class="control-btn" onclick="buyTerritory()">购买领土</button>
            <button class="control-btn" onclick="nextTurn()">下一回合</button>
            
            <div class="diplomacy-panel" id="diplomacyPanel">
                <h3>外交关系</h3>
                <div id="diplomacyList"></div>
            </div>
        </div>

        <div class="main-game">
            <div class="resources-bar">
                <div class="resource-item">
                    <div>金币</div>
                    <div class="resource-value" id="gold">1000</div>
                </div>
                <div class="resource-item">
                    <div>人口</div>
                    <div class="resource-value" id="population">100</div>
                </div>
                <div class="resource-item">
                    <div>军队</div>
                    <div class="resource-value" id="army">50</div>
                </div>
                <div class="resource-item">
                    <div>幸福度</div>
                    <div class="resource-value" id="happiness">75%</div>
                </div>
            </div>

            <div class="game-map">
                <div class="country-display" id="countryDisplay">
                    <h2 id="countryName">未建立国家</h2>
                    <p id="capitalName">请创建您的国家</p>
                    <div id="countryColorDisplay"></div>
                </div>
            </div>

            <div class="hack-menu">
                <div class="hack-menu-title">破解菜单</div>
                <button class="hack-btn" onclick="hackGold()">+1000金币</button>
                <button class="hack-btn" onclick="hackArmy()">+100军队</button>
                <button class="hack-btn" onclick="hackPopulation()">+500人口</button>
            </div>

            <div class="event-log">
                <div class="event-log-title">事件日志</div>
                <div id="eventLogContent"></div>
            </div>
        </div>
    </div>

    <!-- 国家创建模态窗口 -->
    <div class="modal" id="createCountryModal">
        <div class="modal-content">
            <h2>创建您的国家</h2>
            <div class="form-group">
                <label>国家名称:</label>
                <input type="text" id="newCountryName" placeholder="输入国家名称">
            </div>
            <div class="form-group">
                <label>首都名称:</label>
                <input type="text" id="newCapitalName" placeholder="输入首都名称">
            </div>
            <div class="form-group">
                <label>国家颜色:</label>
                <div class="color-selector">
                    <span class="country-color-option active" style="background: #ff0000" onclick="selectColor('#ff0000')"></span>
                    <span class="country-color-option" style="background: #00ff00" onclick="selectColor('#00ff00')"></span>
                    <span class="country-color-option" style="background: #0000ff" onclick="selectColor('#0000ff')"></span>
                    <span class="country-color-option" style="background: #ffff00" onclick="selectColor('#ffff00')"></span>
                    <span class="country-color-option" style="background: #ff00ff" onclick="selectColor('#ff00ff')"></span>
                    <span class="country-color-option" style="background: #00ffff" onclick="selectColor('#00ffff')"></span>
                </div>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-primary" onclick="createCountry()">创建国家</button>
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer>
        <p>所有版权都归Rope所有</p>
    </footer>

    <script>
        // 游戏状态
        let gameState = {
            countryName: '',
            capitalName: '',
            countryColor: '#ff0000',
            gold: 1000,
            population: 100,
            army: 50,
            happiness: 75,
            turn: 1,
            cities: 1,
            diplomacy: {
                '邻国A': { relation: 'friendly', status: '盟友' },
                '邻国B': { relation: 'neutral', status: '中立' },
                '邻国C': { relation: 'hostile', status: '敌对' }
            }
        };

        // 初始化游戏
        window.onload = function() {
            document.getElementById('createCountryModal').style.display = 'block';
            updateDisplay();
        };

        // 选择国家颜色
        function selectColor(color) {
            gameState.countryColor = color;
            // 切换选中状态
            document.querySelectorAll('.country-color-option').forEach(el => {
                el.classList.toggle('active', el.style.background === color);
            });
        }

        // 创建国家
        function createCountry() {
            const countryName = document.getElementById('newCountryName').value.trim();
            const capitalName = document.getElementById('newCapitalName').value.trim();

            if (!countryName || !capitalName) {
                alert('请填写完整信息！');
                return;
            }

            gameState.countryName = countryName;
            gameState.capitalName = capitalName;

            document.getElementById('countryName').textContent = countryName;
            document.getElementById('capitalName').textContent = '首都: ' + capitalName;
            document.getElementById('countryColorDisplay').innerHTML = 
                `<div class="country-color" style="background: ${gameState.countryColor};"></div>`;

            document.getElementById('createCountryModal').style.display = 'none';
            addEvent(`🎉 国家 ${countryName} 成立！首都 ${capitalName} 建立！`);
        }

        // 更新显示
        function updateDisplay() {
            document.getElementById('gold').textContent = gameState.gold;
            document.getElementById('population').textContent = gameState.population;
            document.getElementById('army').textContent = gameState.army;
            document.getElementById('happiness').textContent = gameState.happiness + '%';
        }

        // 建造城市
        function buildCity() {
            if (!gameState.countryName) {
                alert('请先创建国家！');
                return;
            }

            if (gameState.gold >= 500) {
                gameState.gold -= 500;
                gameState.cities += 1;
                gameState.population += 50;
                gameState.happiness = Math.min(100, gameState.happiness + 5);
                updateDisplay();
                addEvent(`🏙️ 新城市建立！人口增加50，幸福度提升。`);
            } else {
                addEvent(`❌ 金币不足，无法建造城市。`);
            }
        }

        // 招募军队
        function recruitArmy() {
            if (!gameState.countryName) {
                alert('请先创建国家！');
                return;
            }

            if (gameState.gold >= 200 && gameState.population >= 10) {
                gameState.gold -= 200;
                gameState.population -= 10;
                gameState.army += 20;
                gameState.happiness = Math.max(0, gameState.happiness - 2);
                updateDisplay();
                addEvent(`⚔️ 招募了20名士兵！`);
            } else {
                addEvent(`❌ 资源不足，无法招募军队。`);
            }
        }

        // 购买领土
        function buyTerritory() {
