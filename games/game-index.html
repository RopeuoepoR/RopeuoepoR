<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小游戏合集 - Rope</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 导航栏样式：与全站统一 */
        nav {
            background-color: #2c3e50;
            padding: 1rem 5%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-home {
            color: #fff;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            background-color: #3498db;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .nav-home:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(52, 152, 219, 0.2);
        }

        /* 页面标题样式 */
        .page-title {
            text-align: center;
            color: #2c3e50;
            font-size: 2.2rem;
            margin: 3rem 0;
            position: relative;
        }

        .page-title::after {
            content: "";
            width: 100px;
            height: 3px;
            background-color: #3498db;
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* 游戏卡片容器：网格布局 */
        .game-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto 4rem;
            padding: 0 5%;
        }

        /* 游戏卡片样式：悬浮动效+视觉分层 */
        .game-card {
            background-color: #fff;
            border-radius: 12px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            border-color: #3498db;
        }

        .game-card i {
            font-size: 3rem;
            color: #3498db;
            margin-bottom: 1.5rem;
        }

        .game-card h3 {
            color: #2c3e50;
            font-size: 1.4rem;
            margin-bottom: 1rem;
        }

        .game-card p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
        }

        .game-btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background-color: #3498db;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .game-btn:hover {
            background-color: #2980b9;
        }

        /* 页脚样式 */
        footer {
            background-color: #2c3e50;
            color: #fff;
            text-align: center;
            padding: 1.5rem 0;
            margin-top: auto;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .page-title {
                font-size: 1.8rem;
                margin: 2rem 0;
            }

            .game-card {
                padding: 2rem 1rem;
            }

            .game-card i {
                font-size: 2.5rem;
            }
        }
    </style>
    <!-- 引入Font Awesome图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav>
        <div class="nav-logo">小游戏合集</div>
        <a href="../index.html" class="nav-home">返回首页</a>
    </nav>

    <h1 class="page-title">休闲小游戏</h1>

    <div class="game-container">
        <!-- 国家领土模拟器卡片 -->
        <div class="game-card">
            <i class="fas fa-globe-asia"></i>
            <h3>国家领土模拟器</h3>
            <p>经营你的国家，扩张领土，成为世界霸主</p>
            <a href="./country-simulator/index.html" class="game-btn">开始游戏</a>
        </div>

        <!-- 五子棋卡片 -->
        <div class="game-card">
            <i class="fas fa-chess-board"></i>
            <h3>五子棋</h3>
            <p>经典对战，黑白对弈，挑战你的策略思维</p>
            <a href="./gobang/index.html" class="game-btn">开始游戏</a>
        </div>
    </div>

    <footer>
        <p>所有版权都归Rope所有</p>
    </footer>
</body>
</html>
