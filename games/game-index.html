<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小游戏合集 - RopeuoepoR的网站</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{
            --pink: #ffe4e6;
            --lightblue: #e0f2fe;
            --darkblue: #0c1a3a;
            --main: #ff6b00;
            --radius: 10px;
            --shadow: 0 4px 12px rgba(0,0,0,.15);
            --shadow-hover: 0 6px 20px rgba(0,0,0,.2);
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body{
            background: var(--lightblue);
            color: #222;
            line-height: 1.6;
            padding-top: 60px;
        }
        a{
            text-decoration: none;
            color: inherit;
        }

        /* 导航栏 - 与主页完全一致 */
        nav{
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #fff;
            box-shadow: var(--shadow);
            z-index: 999;
            display: flex;
            align-items: center;
            padding: 0 20px;
            height: 60px;
            width: 100%;
        }
        .nav-logo{
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--main);
        }
        .hamburger{
            margin-left: auto;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
        }
        .nav-menu{
            position: absolute;
            top: 60px;
            right: 20px;
            background: #fff;
            box-shadow: var(--shadow);
            border-radius: var(--radius);
            display: none;
            flex-direction: column;
            padding: 10px 0;
            min-width: 160px;
            max-width: calc(100vw - 40px);
        }
        .nav-menu.show{
            display: flex;
        }
        .nav-menu a{
            padding: 10px 20px;
        }
        .nav-menu a:hover{
            background: var(--pink);
        }

        /* 页面标题区 */
        .page-header{
            text-align: center;
            padding: clamp(40px, 10vw, 60px) 20px 30px;
        }
        .page-header h1{
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            color: var(--darkblue);
            margin-bottom: 10px;
        }
        .page-header p{
            color: #666;
            font-size: clamp(1rem, 3vw, 1.1rem);
        }

        /* 游戏卡片容器 - 网格布局适配多设备 */
        .game-container{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            padding: 0 20px 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 游戏卡片样式 - 移除图标，简洁悬浮动效 */
        .game-card{
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .game-card:hover{
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            background-color: #fafafa;
        }
        .game-card h3{
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--darkblue);
        }
        .game-card .play-btn{
            display: inline-block;
            padding: 8px 20px;
            background: var(--main);
            color: #fff;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 5px;
            transition: background 0.3s ease;
        }
        .game-card .play-btn:hover{
            background: #e05a00;
        }

        /* 页脚 - 与主页完全一致 */
        footer{
            background: var(--darkblue);
            color: #fff;
            text-align: center;
            padding: clamp(15px, 5vw, 25px);
            font-size: .85rem;
        }
        footer a{
            color: #ffb366;
        }
        footer a:hover{
            text-decoration: underline;
        }

        /* 手机端适配调整 */
        @media(max-width:768px){
            .nav-menu{
                right: 10px;
            }
            .game-container{
                gap: 20px;
            }
            .page-header{
                padding: clamp(30px, 8vw, 50px) 15px 20px;
            }
        }
    </style>
</head>
